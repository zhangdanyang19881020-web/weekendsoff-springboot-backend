openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://127.0.0.1:8080
  description: Generated server url
tags:
- name: 用户
  description: 用户注册等
- name: 公司
  description: 公司查询与 CRUD
paths:
  /api/companies/{id}:
    put:
      tags:
      - 公司
      summary: 更新公司
      description: 公司 ID 放在路径上，body 中不需要 id
      operationId: updateCompany
      parameters:
      - name: id
        in: path
        description: 公司 ID
        required: true
        schema:
          type: integer
          format: int64
        example: 6
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdateDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
    delete:
      tags:
      - 公司
      summary: 删除公司
      operationId: deleteCompany
      parameters:
      - name: id
        in: path
        description: 公司 ID
        required: true
        schema:
          type: integer
          format: int64
        example: 6
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInteger"
  /api/users/update-avatar:
    post:
      tags:
      - 用户
      summary: 更新用户头像
      description: "需在 Header 添加 Authorization: Bearer 登录返回的 token"
      operationId: updateAvatar
      parameters:
      - name: userId
        in: query
        description: 用户 ID
        required: true
        schema:
          type: integer
          format: int64
      - name: avatarUrl
        in: query
        description: 头像 URL
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /api/users/register:
    post:
      tags:
      - 用户
      summary: 用户注册
      description: 用户名不可重复；成功返回新用户 ID
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultLong"
  /api/users/login:
    post:
      tags:
      - 用户
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultLoginResponseDTO"
  /api/companies/addCompany:
    post:
      tags:
      - 公司
      summary: 新增公司
      operationId: addCompany
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyAddDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultCompany"
  /api/company:
    get:
      tags:
      - 公司
      summary: 示例公司（演示）
      description: 返回硬编码 Map，仅用于学习演示
      operationId: getCompany
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/company/{id}:
    get:
      tags:
      - 公司
      summary: 按 ID 查询公司
      operationId: getCompanyById
      parameters:
      - name: id
        in: path
        description: 公司 ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultCompanyResponseDTO"
  /api/companies:
    get:
      tags:
      - 公司
      summary: 获取公司列表
      description: 分页查询，支持按城市、是否双休、名称关键词筛选
      operationId: getCompanyList
      parameters:
      - name: query
        in: query
        description: 查询条件（Query 参数）
        required: true
        schema:
          $ref: "#/components/schemas/CompanyQueryDTO"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultPageResultCompany"
components:
  schemas:
    CompanyUpdateDTO:
      type: object
      description: 要更新的公司信息
      properties:
        name:
          type: string
          description: 公司名称
          example: 周大漠公司
          maxLength: 100
          minLength: 0
        city:
          type: string
          description: 所在城市
          example: 上海
          minLength: 1
        weekendsOff:
          type: boolean
          description: 是否双休
          example: true
      required:
      - city
      - name
      - weekendsOff
    ResultVoid:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data: {}
    UserRegisterDTO:
      type: object
      description: 注册信息
      properties:
        username:
          type: string
          description: 用户名，3-20 位
          example: zhangdaya
          maxLength: 20
          minLength: 3
        password:
          type: string
          description: 密码，6-30 位
          example: 123456
          maxLength: 30
          minLength: 6
        nickname:
          type: string
          description: 昵称（可选）
          example: 大牙
      required:
      - password
      - username
    ResultLong:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: integer
          format: int64
    UserLoginDTO:
      type: object
      description: 登录信息
      properties:
        username:
          type: string
          description: 用户名，3-20 位
          example: zhangdaya
          maxLength: 20
          minLength: 3
        password:
          type: string
          description: 密码，6-30 位
          example: 123456
          maxLength: 30
          minLength: 6
      required:
      - password
      - username
    LoginResponseDTO:
      type: object
      description: 登录成功响应
      properties:
        id:
          type: integer
          format: int64
          description: 用户 ID
          example: 1
        username:
          type: string
          description: 用户名
          example: zhangdaya
        avatar:
          type: string
          description: 头像 URL
          example: https://example.com/avatar.png
        token:
          type: string
          description: 登录令牌（后续鉴权用）
    ResultLoginResponseDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/LoginResponseDTO"
    CompanyAddDTO:
      type: object
      description: 新增公司信息
      properties:
        name:
          type: string
          description: 公司名称
          example: 张大牙科技有限公司
          maxLength: 100
          minLength: 0
        city:
          type: string
          description: 所在城市
          example: 舟山
          minLength: 1
        weekendsOff:
          type: boolean
          description: 是否双休
          example: true
      required:
      - city
      - name
      - weekendsOff
    Company:
      type: object
      description: 公司信息
      properties:
        id:
          type: integer
          format: int64
          description: 公司ID
          example: 1
        name:
          type: string
          description: 公司名称
          example: 公司1
          maxLength: 100
          minLength: 2
        weekendsOff:
          type: boolean
          description: 是否双休
          example: true
        city:
          type: string
          description: 城市
          example: 北京
          minLength: 1
      required:
      - city
      - name
      - weekendsOff
    ResultCompany:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/Company"
    CompanyResponseDTO:
      type: object
      description: 公司信息（响应）
      properties:
        id:
          type: integer
          format: int64
          description: 公司 ID
          example: 1
        name:
          type: string
          description: 公司名称
          example: 宁波测试科技有限公司
        city:
          type: string
          description: 所在城市
          example: 宁波
        weekendsOff:
          type: boolean
          description: 是否双休
          example: true
    ResultCompanyResponseDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/CompanyResponseDTO"
    CompanyQueryDTO:
      type: object
      description: 公司列表查询参数（Query）
      properties:
        page:
          type: integer
          format: int32
          default: 1
          description: 页码，从 1 开始
          example: 1
        pageSize:
          type: integer
          format: int32
          default: 10
          description: 每页条数
          example: 10
        city:
          type: string
          description: 城市（精确匹配）
          example: 宁波
        weekendsOff:
          type: boolean
          description: 是否双休
          example: true
        keyword:
          type: string
          description: 公司名称关键词（模糊匹配）
          example: 科技
    PageResultCompany:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    ResultPageResultCompany:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageResultCompany"
    ResultInteger:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: integer
          format: int32
