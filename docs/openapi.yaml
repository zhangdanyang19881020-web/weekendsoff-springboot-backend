openapi: 3.0.3
info:
  title: weekendsoff-backend
  description: 公司双休查询后端 API（可导入 Apifox / Postman）
  version: 0.0.1-SNAPSHOT

servers:
  - url: http://127.0.0.1:8080
    description: 本地开发

tags:
  - name: Company

paths:
  /api/company:
    get:
      tags: [Company]
      summary: 示例公司（硬编码 Map，演示用）
      operationId: getCompanyDemo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: 1
                name: 宁波测试科技有限公司
                weekendsOff: true
                city: 宁波

  /api/company/{id}:
    get:
      tags: [Company]
      summary: 按 ID 查询公司
      operationId: getCompanyById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultCompanyResponseDTO"
        "404":
          description: 公司不存在（业务 code 404）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultFail"

  /api/companies:
    get:
      tags: [Company]
      summary: 公司分页列表（支持筛选）
      operationId: getCompanyList
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: 每页条数
          schema:
            type: integer
            default: 10
        - name: city
          in: query
          description: 城市精确匹配
          schema:
            type: string
        - name: weekendsOff
          in: query
          description: 是否双休
          schema:
            type: boolean
        - name: keyword
          in: query
          description: 公司名称模糊搜索
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultPageCompany"

  /api/companies/addCompany:
    post:
      tags: [Company]
      summary: 新增公司
      operationId: addCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyAddDTO"
            example:
              name: 张大牙
              city: 舟山
              weekendsOff: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultCompany"
        "400":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultFail"

  /api/companies/{id}:
    put:
      tags: [Company]
      summary: 更新公司（ID 在路径）
      operationId: updateCompany
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdateDTO"
            example:
              name: 周大漠公司
              city: 上海
              weekendsOff: true
      responses:
        "200":
          description: 成功，data 为 null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultVoid"
        "400":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultFail"

    delete:
      tags: [Company]
      summary: 删除公司
      operationId: deleteCompany
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 成功，data 为影响行数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultInteger"

components:
  schemas:
    ResultFail:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: 公司名称不能为空
        data:
          nullable: true

    Company:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        weekendsOff:
          type: boolean
        city:
          type: string

    CompanyResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        weekendsOff:
          type: boolean
        city:
          type: string

    CompanyAddDTO:
      type: object
      required: [name, city, weekendsOff]
      properties:
        name:
          type: string
          maxLength: 100
        city:
          type: string
        weekendsOff:
          type: boolean

    CompanyUpdateDTO:
      type: object
      required: [name, city, weekendsOff]
      properties:
        name:
          type: string
          maxLength: 100
        city:
          type: string
        weekendsOff:
          type: boolean

    PageResultCompany:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    ResultCompany:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/Company"

    ResultCompanyResponseDTO:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/CompanyResponseDTO"

    ResultPageCompany:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/PageResultCompany"

    ResultVoid:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          nullable: true

    ResultInteger:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: integer
